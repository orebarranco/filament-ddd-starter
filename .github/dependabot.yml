version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # vite and laravel-vite-plugin are locked together by peer dependency:
      # the plugin's 3.x line requires vite ^8, its 2.x line requires vite ^7.
      # Split into separate pull requests, each one is unmergeable on its own.
      # No update-types here on purpose, so majors stay grouped too.
      vite:
        patterns:
          - vite
          - laravel-vite-plugin
          - "@tailwindcss/vite"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - vite
          - laravel-vite-plugin
          - "@tailwindcss/vite"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
